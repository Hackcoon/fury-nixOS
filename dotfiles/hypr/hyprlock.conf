# hyprlock — monochrome Tokyo-Night to match fury-bar
background {
    monitor =
    path = screenshot
    blur_passes = 2
    blur_size = 6
}

label {
    monitor =
    text = Enter to unlock
    color = rgba(c0caf5ee)
    font_size = 22
    font_family = JetBrains Mono Nerd Font
    position = 0, -80
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 48
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.15
    dots_center = true
    inner_color = rgba(1a1b26ee)
    outer_color = rgba(7aa2f7ee)
    font_color = rgba(c0caf5ff)
    fade_on_empty = false
    position = 0, -20
    halign = center
    valign = center
}

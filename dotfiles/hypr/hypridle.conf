general {
    # hyprlock-first: DMS `lock` IPC renders nothing on Hyprland 0.55
    # (verified: rc=0, zero log lines, no surface). Mango untouched.
    lock_cmd = pidof hyprlock || /run/current-system/sw/bin/hyprlock   # singleton-guarded; one locker max
    unlock_cmd = pkill -x hyprlock || true
    before_sleep_cmd = loginctl lock-session   # lock BEFORE every suspend
    after_sleep_cmd = hyprctl dispatch dpms on  # ensure screens come back after suspend
    ignore_dbus_inhibit = false
}

listener {
    timeout = 300                            # 5 min: screen off
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

listener {
    timeout = 600                            # 10 min: lock via hyprlock (guarded)
    on-timeout = pidof hyprlock || /run/current-system/sw/bin/hyprlock
    on-resume =
}

listener {
    timeout = 1800                           # 30 min: suspend (locks via before_sleep)
    on-timeout = systemctl suspend
    on-resume =
}
